<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #111113;
            --card-bg: #1a1a1e;
            --text-main: #ffffff;
            --kfc-red: #e41216;
            --kfc-red-hover: #b30e11;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); margin: 0; padding: 16px; color: var(--text-main); }
        .brand-header { text-align: center; padding: 20px 0; margin-bottom: 24px; }
        .brand-header h1 { font-size: 26px; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: 1.5px; }
        .brand-header span { color: var(--kfc-red); }
        .menu-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .menu-card { background: var(--card-bg); padding: 20px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a30; }
        .item-details { display: flex; flex-direction: column; gap: 6px; }
        .item-title { font-size: 19px; font-weight: 800; }
        .item-price { font-size: 16px; font-weight: 700; color: var(--kfc-red); }
        .add-button { background: var(--kfc-red); color: #fff; border: none; padding: 14px 24px; border-radius: 30px; font-size: 16px; font-weight: 800; cursor: pointer; }
        .add-button:active { background: var(--kfc-red-hover); }
        .board { background: var(--card-bg); border: 1px solid #2a2a30; border-radius: 18px; padding: 16px; margin-bottom: 120px; }
        .board h2 { font-size: 18px; margin: 0 0 8px; }
        .person { padding: 10px 0; border-top: 1px solid #2a2a30; }
        .person-name { font-weight: 800; display: flex; justify-content: space-between; gap: 8px; }
        .person-items { font-size: 14px; color: #a0a0aa; margin-top: 4px; }
        .person.me .person-name { color: var(--kfc-red); }
        .board-total { margin-top: 8px; padding-top: 12px; border-top: 1px solid #2a2a30; font-weight: 900; display: flex; justify-content: space-between; }
        .empty { color: #a0a0aa; padding: 8px 0; }
        .closed-banner { background: #2a1a1a; border: 1px solid var(--kfc-red); border-radius: 12px; padding: 10px; margin: 8px 0; font-weight: 700; }
        .sticky-status { position: fixed; bottom: 0; left: 0; right: 0; background: #111113; padding: 20px 16px; text-align: center; }
        .status-pill { background: var(--card-bg); border: 1px solid #2a2a30; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1>KFC <span>GAP</span> MENU</h1>
    </div>

    <div class="menu-container" id="menu">
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Spicy Wings (3 pcs)</div>
                <div class="item-price">25,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Spicy Wings (3 pcs)', 25000)">+ Qo'shish</button>
        </div>
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Original Twister</div>
                <div class="item-price">28,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Original Twister', 28000)">+ Qo'shish</button>
        </div>
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Boxmaster Spicy</div>
                <div class="item-price">39,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Boxmaster Spicy', 39000)">+ Qo'shish</button>
        </div>
    </div>

    <div class="board" id="board">
        <h2>👥 Guruh buyurtmalari</h2>
        <div class="empty">Yuklanmoqda…</div>
    </div>

    <div class="sticky-status">
        <div class="status-pill" id="status-display">Savat bo'sh: <strong>0 taom</strong></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const BASE = "https://kfc-bot-4l1y.onrender.com";
        const sessionId = new URLSearchParams(window.location.search).get('session_id');
        const myId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;

        let cart = [];
        let sending = false;
        let closed = false;
        let loadedOwn = false;

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function updateCartUI() {
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('status-display').innerHTML = cart.length
                ? `Tanlandi: <strong>${cart.length} taom</strong> (${total.toLocaleString()} UZS)`
                : `Savat bo'sh: <strong>0 taom</strong>`;
            if (cart.length && !closed) {
                tg.MainButton.text = `Savatni Tasdiqlash (${total.toLocaleString()} UZS)`;
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        function registerItem(name, price) {
            if (closed) { tg.showAlert("Buyurtma yopilgan"); return; }
            cart.push({ name, price });
            updateCartUI();
        }

        function renderBoard(data) {
            closed = data.status !== 'open';
            let h = `<h2>👥 Guruh buyurtmalari</h2>`;
            if (closed) h += `<div class="closed-banner">🔒 Buyurtma yopilgan — to'lov bosqichi</div>`;
            if (!data.orders.length) h += `<div class="empty">Hali hech kim tanlamadi…</div>`;
            let total = 0;
            data.orders.forEach(o => {
                const sub = o.items.reduce((s, i) => s + i.price, 0);
                total += sub;
                const counts = {};
                o.items.forEach(i => counts[i.name] = (counts[i.name] || 0) + 1);
                const list = Object.entries(counts).map(([n, q]) => `${esc(n)} × ${q}`).join(', ');
                const me = myId && o.uid === myId;
                const mark = closed ? (o.paid ? ' ✅' : ' ⏳') : '';
                h += `<div class="person ${me ? 'me' : ''}">
                        <div class="person-name"><span>${esc(o.name)}${me ? ' (siz)' : ''}${mark}</span><span>${sub.toLocaleString()} UZS</span></div>
                        <div class="person-items">${list}</div>
                      </div>`;
            });
            if (data.orders.length) h += `<div class="board-total"><span>Jami</span><span>${total.toLocaleString()} UZS</span></div>`;
            document.getElementById('board').innerHTML = h;

            if (!loadedOwn) {
                loadedOwn = true;
                const mine = data.orders.find(o => myId && o.uid === myId);
                if (mine && !cart.length) cart = mine.items.slice();
            }
            updateCartUI();
        }

        async function loadBoard() {
            const box = document.getElementById('board');
            try {
                const r = await fetch(`${BASE}/api/session?session_id=${encodeURIComponent(sessionId)}`);
                if (r.status === 404) {
                    box.innerHTML = `<h2>👥 Guruh buyurtmalari</h2><div class="empty">Sessiya topilmadi. Botda yangi gap boshlang.</div>`;
                    return;
                }
                if (!r.ok) throw new Error();
                renderBoard(await r.json());
            } catch (e) {
                box.innerHTML = `<h2>👥 Guruh buyurtmalari</h2><div class="empty">Yuklanmoqda… (server uyg'onmoqda, 1 daqiqagacha kuting)</div>`;
            }
        }

        loadBoard();
        setInterval(loadBoard, 4000);

        tg.onEvent('mainButtonClicked', function () {
            if (sending || closed) return;
            sending = true;
            tg.MainButton.showProgress();

            fetch(`${BASE}/api/order`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, initData: tg.initData, items: cart })
            })
            .then(r => {
                if (r.status === 409) throw new Error("closed");
                if (!r.ok) throw new Error();
                sending = false;
                tg.MainButton.hideProgress();
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert("✅ Buyurtmangiz saqlandi!");
                loadBoard();
            })
            .catch(err => {
                sending = false;
                tg.MainButton.hideProgress();
                tg.showAlert(err.message === "closed" ? "Buyurtma yopilgan" : "Xatolik, qayta urinib ko'ring");
            });
        });
    </script>
</body>
</html>
