<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #111113;
            --card-bg: #1a1a1e;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --kfc-red: #e41216;
            --kfc-red-hover: #b30e11;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 16px; 
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
        }

        .brand-header { 
            text-align: center; 
            padding: 20px 0;
            margin-bottom: 24px;
        }
        
        .brand-header h1 {
            font-size: 26px; 
            font-weight: 900; 
            margin: 0;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        .brand-header span {
            color: var(--kfc-red);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 100px;
        }

        /* Enriched Visual Hierarchy & Giant Tap Targets */
        .menu-card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
            border: 1px solid #2a2a30;
            transition: transform 0.1s ease;
        }
        
        .menu-card:active {
            transform: scale(0.98);
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-title { 
            font-size: 19px; 
            font-weight: 800; 
            color: var(--text-main); 
        }

        .item-price { 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--kfc-red); 
        }

        .add-button { 
            background: var(--kfc-red); 
            color: #fff; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 30px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(228, 18, 22, 0.3);
        }

        .add-button:active { 
            background: var(--kfc-red-hover); 
        }

        /* Fixed Elegant Bottom Status Bar */
        .sticky-status { 
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #111113 80%, rgba(17,17,19,0));
            padding: 20px 16px;
            text-align: center;
        }
        
        .status-pill {
            background: var(--card-bg);
            border: 1px solid #2a2a30;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px; 
            font-weight: 700; 
            color: var(--text-muted);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        }
        
        .status-pill strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1>KFC <span>GAP</span> MENU</h1>
    </div>
    
    <div class="menu-container" id="menu">
        <!-- Giant, Beautiful Product Cards -->
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Spicy Wings (3 pcs)</div>
                <div class="item-price">25,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Spicy Wings (3 pcs)', 25000)">+ Qo'shish</button>
        </div>
        
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Original Twister</div>
                <div class="item-price">28,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Original Twister', 28000)">+ Qo'shish</button>
        </div>
        
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Boxmaster Spicy</div>
                <div class="item-price">39,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Boxmaster Spicy', 39000)">+ Qo'shish</button>
        </div>
        
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Basket L (26 Wings)</div>
                <div class="item-price">170,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Basket L (26 Wings)', 170000)">+ Qo'shish</button>
        </div>

        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">French Fries Max</div>
                <div class="item-price">22,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('French Fries Max', 22000)">+ Qo'shish</button>
        </div>
    </div>
    
    <div class="sticky-status">
        <div class="status-pill" id="status-display">Savat bo'sh: <strong>0 taom</strong></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Dynamic styling integration based on active framework rules
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        let cart = [];

        function registerItem(name, price) {
            cart.push({ name, price });
            
            const totalItems = cart.length;
            const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
            
            document.getElementById('status-display').innerHTML = `Tanlandi: <strong>${totalItems} taom</strong> (${totalPrice.toLocaleString()} UZS)`;
            
            tg.MainButton.text = `Savatni Tasdiqlash (${totalPrice.toLocaleString()} UZS)`;
            tg.MainButton.textColor = "#ffffff";
            tg.MainButton.color = "#e41216";
            tg.MainButton.show();
        }

        tg.onEvent('mainButtonClicked', function() {
            const payload = {
                session_id: sessionId,
                user: tg.initDataUnsafe.user?.first_name || "Mexmon",
                items: cart
            };
            tg.sendData(JSON.stringify(payload));
            tg.close();
        });
    </script>
</body>
</html>
