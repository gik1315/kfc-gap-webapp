<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #111113;
            --card-bg: #1a1a1e;
            --text-main: #ffffff;
            --kfc-red: #e41216;
            --kfc-red-hover: #b30e11;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); margin: 0; padding: 16px; color: var(--text-main); }
        .brand-header { text-align: center; padding: 20px 0; margin-bottom: 24px; }
        .brand-header h1 { font-size: 26px; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: 1.5px; }
        .brand-header span { color: var(--kfc-red); }
        .menu-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 100px; }
        .menu-card { background: var(--card-bg); padding: 20px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a30; }
        .item-details { display: flex; flex-direction: column; gap: 6px; }
        .item-title { font-size: 19px; font-weight: 800; }
        .item-price { font-size: 16px; font-weight: 700; color: var(--kfc-red); }
        .add-button { background: var(--kfc-red); color: #fff; border: none; padding: 14px 24px; border-radius: 30px; font-size: 16px; font-weight: 800; cursor: pointer; }
        .add-button:active { background: var(--kfc-red-hover); }
        .sticky-status { position: fixed; bottom: 0; left: 0; right: 0; background: #111113; padding: 20px 16px; text-align: center; }
        .status-pill { background: var(--card-bg); border: 1px solid #2a2a30; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1>KFC <span>GAP</span> MENU</h1>
    </div>
    
    <div class="menu-container" id="menu">
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Spicy Wings (3 pcs)</div>
                <div class="item-price">25,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Spicy Wings (3 pcs)', 25000)">+ Qo'shish</button>
        </div>
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Original Twister</div>
                <div class="item-price">28,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Original Twister', 28000)">+ Qo'shish</button>
        </div>
        <div class="menu-card">
            <div class="item-details">
                <div class="item-title">Boxmaster Spicy</div>
                <div class="item-price">39,000 UZS</div>
            </div>
            <button class="add-button" onclick="registerItem('Boxmaster Spicy', 39000)">+ Qo'shish</button>
        </div>
    </div>
    
    <div class="sticky-status">
        <div class="status-pill" id="status-display">Savat bo'sh: <strong>0 taom</strong></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        let cart = [];

        function registerItem(name, price) {
            cart.push({ name, price });
            const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('status-display').innerHTML = `Tanlandi: <strong>${cart.length} taom</strong> (${totalPrice.toLocaleString()} UZS)`;
            
            tg.MainButton.text = `Savatni Tasdiqlash (${totalPrice.toLocaleString()} UZS)`;
            tg.MainButton.show();
        }

        tg.onEvent('mainButtonClicked', function() {
            const payload = {
                session_id: sessionId,
                user: tg.initDataUnsafe.user?.first_name || "Mexmon",
                items: cart
            };

            // BYPASS MECHANIC: Uses HTTP REST routing fallback to bypass sendData blocks
            const bot_token = "8873913614:AAHKDn6gfcXUXIUM9QaBuRvGVjoDPkIoOZY";
            const query_id = tg.initDataUnsafe.query_id;

            if (query_id) {
                // If opened via inline button, route data through the background cloud bridge
                fetch(`https://telegram.org{bot_token}/answerWebAppQuery`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        web_app_query_id: query_id,
                        result: {
                            type: 'article',
                            id: 'order_payload',
                            title: 'KFC Order',
                            input_message_content: {
                                message_text: `###GAP_DATA###${JSON.stringify(payload)}`
                            }
                        }
                    })
                }).then(() => tg.close()).catch(() => tg.close());
            } else {
                // Fallback for primary host running via direct text keyboard structures
               const API = "https://YOUR-RENDER-ADDRESS.onrender.com/api/order";
const sid = new URLSearchParams(location.search).get("session_id");
fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ session_id: sid, initData: tg.initData, items: payload.items })
})
.then(r => { if (!r.ok) throw new Error(); tg.close(); })
.catch(() => tg.showAlert("Xatolik, qayta urinib ko'ring"));
            }
        });
    </script>
</body>
</html>
